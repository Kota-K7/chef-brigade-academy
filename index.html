<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHEF BRIGADE ACADEMY</title>
  <meta name="application-name" content="CHEF BRIGADE ACADEMY">
  <meta name="apple-mobile-web-app-title" content="CHEF BRIGADE ACADEMY">
  <meta name="description" content="フランス料理学校の講義、厨房で使えるフランス語・英語・実務語彙を学べる統合型PWA学習アプリ。">
  <link rel="icon" href="/assets/favicon-DMp53RVz.ico" type="image/x-icon">
  <meta name="theme-color" content="#0A1931">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-ymfMIumA.png">
  <script type="module" crossorigin src="/assets/index-DzQ4tu2o.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CZCruM7R.css">
<link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
<body>
  <div id="app-container">
    <header>
      <div class="header-content-wrapper">
        <div class="header-inner">
          <div class="brand">
            <span class="tricolore-flag"></span>
            <div>
              <h1>Académie de la Brigade</h1>
              <div class="brand-subtitle">Cuisine & Langue</div>
            </div>
          </div>
          <button id="hamburger-menu-toggle" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>
        </div>
      </div>
      <div class="header-band red-band"></div>
      <div class="nav-band">
        <div class="nav-inner">
          <nav id="main-nav">
            <div class="nav-left-menu">
              <div class="nav-menu-group">
                <button class="nav-link active" data-tab="home">Home</button>
              </div>
              <div class="nav-group-divider"></div>
              <div class="nav-menu-group">
                <button class="nav-link" data-tab="vocabulary">Vocabulary</button>
                <button class="nav-link" data-tab="grammar">Grammar</button>
                <button class="nav-link" data-tab="reference">Reference</button>
              </div>
              <div class="nav-group-divider"></div>
              <div class="nav-menu-group">
                <button class="nav-link" data-tab="reading">Reading</button>
                <button class="nav-link" data-tab="story">RPG</button>
              </div>
              <div class="nav-group-divider"></div>
              <div class="nav-menu-group">
                <button class="nav-link" data-tab="cuisine">Cuisine</button>
              </div>
              <div class="nav-group-divider"></div>
              <div class="nav-menu-group">
                <button class="nav-link" data-tab="quiz">Quiz</button>
                <button class="nav-link" data-tab="dictation">Dictation</button>
                <button class="nav-link" data-tab="review">Review</button>
              </div>
            </div>
            <div class="nav-right-menu">
              <div class="nav-menu-group">
                <button class="nav-link utility-icon-link" data-tab="search" title="Search">🔍</button>
                <button class="nav-link utility-icon-link" data-tab="favorites" title="Favorites">⭐</button>
                <button class="nav-link utility-icon-link" data-tab="settings" title="Settings">⚙️</button>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <main id="main-content">
      <!-- Views are loaded here dynamically by app.js -->
      <div class="loading-placeholder">Académie Loading...</div>
    </main>

    <footer>
      <p>&copy; 2026 Chef Brigade Academy. Conçu pour l'excellence en cuisine.</p>
    </footer>
  </div>

  <!-- YouGlish Floating Sidebar Panel -->
  <div id="youglish-sidebar" class="youglish-sidebar">
    <button id="youglish-sidebar-toggle" class="youglish-toggle-btn" title="YouGlish 発音検索">
      <span class="toggle-icon">🔊</span>
      <span class="toggle-label">YouGlish</span>
    </button>
    <div class="youglish-sidebar-content">
      <div class="youglish-header">
        <h3>YouGlish French 🇫🇷</h3>
        <p>知らない料理やレシピ用語の動画と発音をその場で検索・再生します。</p>
      </div>
      <div class="youglish-search-box">
        <input type="text" id="youglish-search-input" placeholder="検索ワードを入力 (例: sauter)">
        <button id="youglish-search-btn">検索</button>
      </div>
      <div id="yg-widget-container" class="yg-widget-container">
        <div class="yg-placeholder">単語を入力して検索ボタンを押してください。</div>
      </div>
    </div>
  </div>

  <script async src="https://youglish.com/public/widget/widget.js" charset="utf-8"></script>

</html>
